<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ChatGPT (source chip fixture)</title>
<!-- Mirrors what chatgpt.com served to a logged-out visitor on 2026-10-03: a visible
     textarea#mobile-composer-prompt, and a transcript that is ol[data-conversation-transcript]
     of li[data-message-role=user|assistant], each starting with an h4 "You said:" / "ChatGPT said:".
     On 2026-10-04 the sources were chips: <button aria-controls=assistant-sources-dialog> inside the answer, and the URLs
     only exist in a <dialog id=assistant-sources-dialog> opened by clicking one (links carry ?utm_source=chatgpt.com).
     There is no [data-message-author-role], no role=log, no <main>, no <article> with the answer. -->
<style>body{font-family:system-ui;background:#111;color:#eee} .c{position:fixed;bottom:12px;left:12px;right:12px;display:flex;gap:8px} textarea{flex:1;height:48px}</style>
</head>
<body>
<div id="t"><ol data-conversation-transcript></ol></div>
<div class="c">
  <textarea id="mobile-composer-prompt" aria-label="Chat with ChatGPT" placeholder="Ask ChatGPT"></textarea>
  <button aria-label="Send message" id="send">Send</button>
</div>
<script>
const ol = document.querySelector('ol');
const input = document.getElementById('mobile-composer-prompt');
function turn(role, label, html, extra) {
  const li = document.createElement('li');
  li.id = crypto.randomUUID();
  li.setAttribute('data-message-role', role);
  if (extra) li.setAttribute(extra, '');
  li.innerHTML = '<h4 data-message-attribution>' + label + '</h4><div>' + html + '</div>';
  ol.appendChild(li);
  return li;
}
function go() {
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  const u = turn('user', 'You said:', '');
  u.lastChild.textContent = text;
  setTimeout(() => turn('assistant', 'ChatGPT said:', '<p>2018 - Data Protection Act 2018 <button class="chip" aria-controls="assistant-sources-dialog" aria-haspopup="dialog" onclick="openSources()">legislation.gov.uk</button></p>', 'data-message-complete'), 700);
}
function openSources() {
  if (document.getElementById('assistant-sources-dialog')) return;
  const d = document.createElement('dialog');
  d.id = 'assistant-sources-dialog'; d.setAttribute('open', '');
  d.innerHTML = '<h2>Sources</h2><a href="https://www.legislation.gov.uk/ukpga/2018/12/introduction/2026-09-30?utm_source=chatgpt.com"><div>L</div><div>legislation.gov.uk</div><div>Data Protection Act 2018</div></a><a href="https://chatgpt.com/help">help</a>';
  document.body.appendChild(d);
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') { const d = document.getElementById('assistant-sources-dialog'); if (d) d.remove(); } });
document.getElementById('send').onclick = go;
input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); go(); } });
</script>
</body>
</html>
