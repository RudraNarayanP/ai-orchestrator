<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ChatGPT (logged-out, sign-up nudge fixture)</title>
<!-- A provider that lets you chat without an account but first shows a sign-up nudge over the page, like chatgpt.com
     logged out: "Thanks for trying ChatGPT ... Log in / Sign up for free / Stay logged out". Sending is ignored while
     the nudge is up. Only "Stay logged out" may be pressed; "Log in" / "Sign up" must never be. -->
<style>body{font-family:system-ui;background:#111;color:#eee} .c{position:fixed;bottom:12px;left:12px;right:12px;display:flex;gap:8px} textarea{flex:1;height:48px}
#nudge{position:fixed;top:25%;left:25%;width:50%;height:50%;background:#222;padding:20px;z-index:10}</style>
</head>
<body>
<div id="t"><ol data-conversation-transcript></ol></div>
<div class="c">
  <textarea id="mobile-composer-prompt" aria-label="Chat with ChatGPT" placeholder="Ask ChatGPT"></textarea>
  <button aria-label="Send message" id="send">Send</button>
</div>
<script>
window.__guest = false; window.__loginClicked = false;
const ol = document.querySelector('ol');
const input = document.getElementById('mobile-composer-prompt');
function nudge() {
  if (window.__guest || document.getElementById('nudge')) return;
  const d = document.createElement('div');
  d.id = 'nudge'; d.setAttribute('role', 'dialog'); d.setAttribute('aria-modal', 'true');
  d.innerHTML = '<h2>Thanks for trying ChatGPT</h2><p>Log in or sign up to get smarter responses, upload files and images, and more.</p>' +
    '<button id="login" onclick="window.__loginClicked=true">Log in</button> ' +
    '<button id="signup" onclick="window.__loginClicked=true">Sign up for free</button> ' +
    '<a href="#" id="stay">Stay logged out</a>';
  document.body.appendChild(d);
  document.getElementById('stay').onclick = (e) => { e.preventDefault(); window.__guest = true; d.remove(); };
}
setTimeout(nudge, 300);
function turn(role, label, html, extra) {
  const li = document.createElement('li');
  li.id = crypto.randomUUID();
  li.setAttribute('data-message-role', role);
  if (extra) li.setAttribute(extra, '');
  li.innerHTML = '<h4 data-message-attribution>' + label + '</h4><div>' + html + '</div>';
  ol.appendChild(li);
  return li;
}
function go() {
  if (document.getElementById('nudge')) return;  // the nudge swallows the send
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  const u = turn('user', 'You said:', '');
  u.lastChild.textContent = text;
  setTimeout(() => turn('assistant', 'ChatGPT said:', '<p>The Eiffel Tower was completed on March 31, 1889 and is about 330 metres tall.</p>', 'data-message-complete'), 700);
}
document.getElementById('send').onclick = go;
input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); go(); } });
</script>
</body>
</html>
