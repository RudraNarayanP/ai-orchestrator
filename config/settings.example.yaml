# OmniBrain configuration.
# Copy to config/settings.yaml (that file is what gets loaded) and edit.
#
# BROWSER ISOLATION, THE SHORT VERSION
# OmniBrain runs in its own Chrome window(s) with their own profiles under
# browser/profiles/. It never attaches to, reads, or clicks inside the Chrome you
# use day to day, and it never copies your session cookies out of it.
#
# Default is ONE window with one tab per provider, reused between runs -- a run
# should not leave eight Chrome windows on your desktop. Set window_mode:
# per_provider if you want each site isolated in its own profile at the cost of
# one window each.
#
# You asked about driving your real logged-in Chrome: Chrome 136+ ignores
# --remote-debugging-port on the default profile, so there is no port to point
# cdp_url at unless you relaunch Chrome with a separate --user-data-dir (which
# would be a different, logged-out profile). The practical route is to sign into
# the OmniBrain profile once -- run.py login -- and it is remembered.

browser:
  channel: chrome            # installed Chrome; set to "msedge" to use Edge
  headless: false            # you must be able to watch it work
  window_mode: single        # single | per_provider
  reuse_tabs: true           # adopt an already-open provider tab instead of another
  # cdp_url: http://127.0.0.1:9222   # only useful for a Chrome YOU launched with
                                     # --remote-debugging-port and a non-default profile
  width: 1440
  height: 900
  window_offset_x: 60
  window_offset_y: 40
  nav_timeout_ms: 45000
  settle_ms: 900
  max_concurrent_profiles: 4  # in single mode this caps concurrent tabs
  focus_nudge_after_s: 25     # bring a stalled background tab forward after this long
  keep_windows_open: true

verifier:
  # OpenRouter FREE models first. Get a key at https://openrouter.ai/keys and either put it in
  # config/settings.yaml (gitignored) or export OPENROUTER_API_KEY -- never commit a key.
  # Free ids end in ":free"; the list changes, see https://openrouter.ai/api/v1/models.
  # Free models are rate limited upstream: on a 429 we wait, then try fallback_models in order,
  # and if all fail the verdicts come from the evidence ledger and the caveats say so.
  # Alternative: provider: ollama, model: qwen3:14b, base_url: http://localhost:11434/v1
  # (provider: ollama | lm_studio | openrouter | openai_compatible | disabled)
  provider: openrouter
  model: nvidia/nemotron-3-super-120b-a12b:free
  base_url: https://openrouter.ai/api/v1
  api_key: ""                # never leaves the backend; empty -> OPENROUTER_API_KEY
  fallback_models:
  - poolside/laguna-s-2.1:free
  - qwen/qwen3.8-27b:free
  - google/gemma-4-31b-it:free
  headers:                   # optional OpenRouter attribution headers
    HTTP-Referer: http://localhost
    X-Title: OmniBrain
  temperature: 0.1
  max_tokens: 4096
  timeout_s: 240
  deep_verification: true
  inspect_cited_sources: true
  max_sources_per_claim: 3

analysis:
  # cheaper endpoint for question analysis / claim extraction / synthesis
  provider: openrouter
  model: poolside/laguna-s-2.1:free
  base_url: https://openrouter.ai/api/v1
  api_key: ""
  fallback_models:
  - apodex/apodex-1.1-mini:free
  - nvidia/nemotron-3-super-120b-a12b:free
  headers:                   # optional OpenRouter attribution headers
    HTTP-Referer: http://localhost
    X-Title: OmniBrain
  temperature: 0.3
  max_tokens: 2048

vision:
  # Level-2 fallback: when the DOM path reports BROKEN (selector drift, or a UI
  # drawn on a canvas) and the prompt has not been sent yet, screenshot the page
  # and ask a vision-capable OpenAI-compatible model where the composer is.
  # It never touches a captcha, login or payment control; an answer obtained this
  # way is marked detail="vision fallback" and has no citations. Set
  # provider: disabled to turn it off. The model must accept image input.
  provider: openrouter       # disabled | ollama | lm_studio | openrouter | openai_compatible
  model: nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free   # Ollama alternative: qwen2.5vl:7b
  base_url: https://openrouter.ai/api/v1
  api_key: ""
  fallback_models:
  - qwen/qwen3.8-27b:free
  - google/gemma-4-31b-it:free
  headers:                   # optional OpenRouter attribution headers
    HTTP-Referer: http://localhost
    X-Title: OmniBrain
  max_calls: 6
  wait_s: 90
  stable_s: 3.0

research:
  mode: STANDARD             # QUICK | STANDARD | DEEP_RESEARCH
  max_rounds: 3
  max_workers: 4
  per_provider_concurrency: 1
  min_provider_spacing_s: 2.0        # pause between two questions to the same site
  rate_limit_backoff_s: 30.0         # after a rate limit: wait this long, doubling per consecutive limit
  rate_limit_backoff_max_s: 600.0
  rate_limit_max_wait_s: 45.0        # a longer backoff is not waited out; the site is skipped for that question
  follow_up_providers: 3
  min_independent_sources: 2
  claim_batch_size: 12
  response_stability_poll_ms: 700
  response_stable_rounds: 3

search:
  engines: [duckduckgo, google]
  max_results: 8
  fetch_body_chars: 12000
  refutation_queries: 3      # claims per round that also get a "who says this is wrong?" search; 0 = off
  review_queries: 3          # product/service questions: review-site searches (Reddit, G2, app stores); 0 = off
  per_query_timeout_s: 40

storage:
  db_path: data/omnibrain.db
  artifacts_dir: data/artifacts
  keep_raw_responses: true
  max_events_per_job: 4000      # routine events beyond this are dropped; final/done/error are always kept
  log_path: data/omnibrain.log  # rotating, 2 MB x 3; run.py serve|ask --log-file overrides

providers:
  chatgpt:
    enabled: true
    label: ChatGPT
    url: https://chatgpt.com/
    requires_login: false  # verified live logged out; signing in only lifts rate limits
    new_chat_url: https://chatgpt.com/

  gemini:
    enabled: true
    label: Gemini
    url: https://gemini.google.com/app
    requires_login: false  # verified live logged out
    new_chat_url: https://gemini.google.com/app

  google_ai:
    # Google's consumer AI search overlay ("AI Mode"), i.e. the AI answer layer
    # on top of Search -- deliberately separate from the Gemini chat app.
    enabled: true
    label: Google AI
    url: https://www.google.com/search?udm=50
    new_chat_url: https://www.google.com/search?udm=50  # AI Mode only (udm=50), never plain Search
    requires_login: false  # no sign-in needed, but logged-out AI Mode often returns no answer block
    notes: Uses Google AI Mode; no login needed but a consent wall can appear.

  copilot:
    enabled: true
    label: Microsoft Copilot
    url: https://copilot.microsoft.com/
    new_chat_url: https://copilot.microsoft.com/

  meta_ai:
    enabled: true
    label: Meta AI
    url: https://meta.ai/
    new_chat_url: https://meta.ai/

  le_chat:
    enabled: true
    label: Le Chat
    url: https://chat.mistral.ai/chat
    new_chat_url: https://chat.mistral.ai/chat

  pi:
    enabled: true
    label: Pi
    url: https://pi.ai/
    new_chat_url: https://pi.ai/
    requires_login: true
    notes: Pi keeps no searchable history in some regions; capture is live-only.

  search:
    # Not a chat model: real web research in a dedicated window. This is the
    # layer that produces independent evidence instead of another opinion.
    enabled: true
    label: Google Search
    url: https://www.google.com/search?q=
    requires_login: false
    notes: Doubles as the citation-fetching transport.

  qwen:
    enabled: true
    label: Qwen Chat
    url: https://chat.qwen.ai/
    new_chat_url: https://chat.qwen.ai/
    adapter: generic_chat
    notes: Selectors not yet probed; uses candidate scoring. Sign in once in its window.

  deepseek:
    enabled: true
    label: DeepSeek
    url: https://chat.deepseek.com/
    new_chat_url: https://chat.deepseek.com/
    adapter: generic_chat
    notes: Consumer web chat at chat.deepseek.com; needs a one-time sign-in in its window.

  # ---- further examples of config-only providers (adapter inherited from the
  # ---- generic chat adapter, so adding a site is configuration, not new code) ----
  perplexity:
    enabled: false
    label: Perplexity
    url: https://www.perplexity.ai/
    adapter: generic_chat

  grok:
    enabled: false
    label: Grok
    url: https://grok.com/
    adapter: generic_chat
